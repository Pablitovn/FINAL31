  <!-- A11y announcements para screen readers -->
  <div aria-live="polite" class="sr-only" id="a11y-announcements" role="status"></div>
  
  <!-- Auth overlay para login/logout -->
  <div id="auth-overlay"></div>
  
  <!-- App container principal -->

    <!-- ════════════════════════════════════════════════════════════════
         HEADER
         ════════════════════════════════════════════════════════════════ -->
    <header class="lg-header" id="app-header">
      <div class="lg-brand-lockup">
        <div aria-hidden="true" class="lg-brand-mark">M</div>
        <div>
          <div class="lg-brand">MASTER</div>
          <div class="lg-subbrand">INTELLIGENT MASTERING CONSOLE</div>
        </div>
      </div>
      <div class="lg-header-center">
        <div class="lg-session-chip">
          <span aria-hidden="true" class="status-dot"></span>
          <span id="statusBar">Listo</span>
        </div>
        <div class="lg-work-state">Professional Audio Workflow</div>
      </div>
      <div class="lg-header-actions">
        <button aria-label="Cambiar tema" class="lg-icon-btn" id="theme-switcher-btn" title="Cambiar tema" type="button">◐</button>
        <button class="lg-icon-btn" id="helpBtn" title="Ayuda" type="button">?</button>
        <button aria-label="Cerrar sesión" class="lg-icon-btn" id="logoutBtn" title="Cerrar sesión" type="button">↪</button>
      </div>
    </header>

    <!-- ════════════════════════════════════════════════════════════════
         MAIN APP BODY (Layout grid: sidebar | center | right)
         ══════════════════════════════════════════════════════��═════════ -->
    <div class="lg-app-body" id="appBody">
      
      <!-- ────────────────────────────────────────────────────────────
           LEFT SIDEBAR — Workflow steps
           ──────────────────────────────────────────────────────────── -->
      <aside aria-label="Flujo de trabajo" class="lg-sidebar" id="workflowSidebar">
        <div class="lg-sidebar-head">
          <div>
            <div class="eyebrow">WORKFLOW</div>
            <h2>Pasos de Mastering</h2>
          </div>
        </div>
        
        <!-- Sidebar tabs -->
        <div class="sidebar-tabs">
          <button class="sidebar-tab active" data-pane="pane-archivo" type="button">📁 Archivo</button>
          <button class="sidebar-tab" data-pane="pane-cadena" type="button">⛓ Cadena</button>
          <button class="sidebar-tab" data-pane="pane-salida" type="button">🎚 Salida</button>
          <button class="sidebar-tab" data-pane="pane-proyectos" type="button">📦 Proyectos</button>
        </div>

        <!-- Sidebar pane container -->
        <div class="control-grid sidebar-showing-archivo" id="sidebarPaneContainer">
          <!-- Content will be dynamically populated by JS -->
          <div class="loading-placeholder">Cargando pasos...</div>
        </div>
      </aside>

      <!-- ────────────────────────────────────────────────────────────
           CENTER CONSOLE — Main mastering interface
           ──────────────────────────────────────────────────────────── -->
      <main class="lg-console-center" id="consoleCenter" role="main">
        <!-- Content will be dynamically populated by JS -->
        <div class="loading-placeholder">Inicializando consola...</div>
      </main>

      <!-- ────────────────────────────────────────────────────────────
           RIGHT PANEL — Metering, visualization, outputs
           ──────────────────────────────────────────────────────────── -->
      <aside class="lg-panel-right" id="panelRight" aria-label="Métricas y visualización">
        <!-- Content will be dynamically populated by JS -->
        <div class="loading-placeholder">Inicializando panel derecho...</div>
      </aside>
    </div>

    <!-- ════════════════════════════════════════════════════════════════
         FOOTER / STATUS BAR
         ════════════════════════════════════════════════════════════════ -->
    <footer class="lg-footer" id="app-footer">
      <div id="footerStatus">Ready</div>
    </footer>
  </div>
